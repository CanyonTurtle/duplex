[package]
name = "duplex"
version = "0.1.0"
edition = "2018"

[dependencies]
nom = "4.1.1"
lazy_static = "1.2.0"
serde = { version = "1.0.82", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
